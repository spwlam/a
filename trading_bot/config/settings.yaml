# =============================================================================
# settings.yaml — Global Tunable Parameters
# =============================================================================
# All strategy, session, and execution parameters live here.
# No magic numbers should exist in code — reference this file instead.
# =============================================================================

# ---------------------------------------------------------------------------
# Trading Universe
# ---------------------------------------------------------------------------
trading:
  symbols:
    - "NQ=F"    # Nasdaq 100 Futures (primary)
    - "ES=F"    # S&P 500 Futures
    - "SPY"     # S&P 500 ETF (equity fallback)
  primary_timeframe: "15m"    # Signal timeframe
  htf_timeframe: "1h"         # Higher timeframe for ICT bias
  ltf_timeframe: "5m"         # Lower timeframe for entry refinement
  mode: "paper"               # paper | live

# ---------------------------------------------------------------------------
# Session Windows (all times in UTC)
# ---------------------------------------------------------------------------
sessions:
  london:
    start: "02:00"
    end: "05:00"
    enabled: true
  new_york_open:
    start: "09:30"
    end: "11:00"    # Kill zone: high-probability window
    enabled: true
  new_york_afternoon:
    start: "13:30"
    end: "16:00"
    enabled: false   # Lower probability — disabled by default
  london_close:
    start: "15:00"
    end: "16:00"
    enabled: false

# ---------------------------------------------------------------------------
# ICT Parameters
# ---------------------------------------------------------------------------
ict:
  # Fair Value Gap
  fvg:
    min_gap_pct: 0.05          # Minimum gap size as % of price to qualify
    max_lookback_bars: 50      # How far back to scan for unmitigated FVGs
    require_imbalance: true    # Gap must be a true price imbalance (no overlap)

  # Market Structure
  structure:
    swing_lookback: 5          # Bars left/right to confirm swing high/low
    displacement_atr_mult: 1.5 # Minimum move (in ATR) to qualify as displacement
    bos_confirmation: "close"  # close | wick — what constitutes a BOS

  # Liquidity Levels
  levels:
    use_pdh_pdl: true          # Previous Day High/Low
    use_pwh_pwl: true          # Previous Week High/Low
    use_pmh_pml: false         # Previous Month High/Low
    proximity_pct: 0.1         # % distance to consider price "at" a level

  # Bias
  bias:
    htf_required: true         # Must have HTF alignment before entry
    allow_counter_trend: false  # Strict: only trade in bias direction

# ---------------------------------------------------------------------------
# Strat Parameters
# ---------------------------------------------------------------------------
strat:
  # Candle classification thresholds
  classifier:
    inside_bar_tolerance: 0.0  # Exact — no tolerance for Type 1

  # Pattern recognition
  patterns:
    lookback: 3                # Bars to look back for pattern completion
    valid_patterns:
      - "2u-1-2u"              # Bullish continuation
      - "2d-1-2d"              # Bearish continuation
      - "3-1-2u"               # Bullish reversal setup
      - "3-1-2d"               # Bearish reversal setup
      - "2u-2u"                # Broadening top (caution)
      - "2d-2d"                # Broadening bottom (caution)

# ---------------------------------------------------------------------------
# Signal Engine
# ---------------------------------------------------------------------------
signal:
  require_ict_fvg: true        # FVG must be present in entry zone
  require_htf_bias: true       # HTF bias must align
  require_session_window: true # Must be within an active kill zone
  require_strat_pattern: true  # Valid Strat pattern must precede entry
  min_rr_ratio: 2.0            # Minimum risk:reward to generate signal

# ---------------------------------------------------------------------------
# Execution
# ---------------------------------------------------------------------------
execution:
  slippage_ticks: 1            # Simulated slippage for paper trading
  commission_per_side: 0.65    # USD per contract (NQ futures approx)
  order_type: "limit"          # limit | market
  fill_timeout_bars: 3         # Cancel unfilled limit order after N bars

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "DEBUG"               # DEBUG | INFO | WARNING | ERROR
  log_dir: "logs/"
  rotate_size: "10 MB"
  retention: "30 days"
  format: "json"               # json | text
